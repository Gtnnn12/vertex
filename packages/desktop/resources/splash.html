<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  /* VERTEX splash — dark base, mint accent gradient, matching the app's
     visual language. Honours prefers-reduced-motion: the bar becomes a
     static pill and the logo stays still. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0b0b10;
    background-image:
      radial-gradient(ellipse 120% 90% at 50% 115%, rgba(61, 220, 151, 0.16), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(61, 220, 151, 0.07), transparent 55%);
    color: #f5f5f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: default;
  }
  .logo { display: flex; align-items: baseline; gap: 2px; }
  .logo .word {
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #ffffff;
    line-height: 1;
  }
  .logo .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #3ddc97;
    box-shadow: 0 0 14px rgba(61, 220, 151, 0.8);
    margin-left: 6px;
    align-self: flex-end;
    margin-bottom: 6px;
  }
  .tagline {
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(245, 245, 247, 0.55);
  }
  .track {
    margin-top: 34px;
    width: 180px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    position: relative;
  }
  .bar {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 40%;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(61, 220, 151, 0.4), #3ddc97);
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { left: -40%; }
    60%  { left: 100%; }
    100% { left: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar { animation: none; left: 30%; }
  }
</style>
</head>
<body>
  <div class="logo">
    <span class="word">VERTEX</span>
    <span class="dot"></span>
  </div>
  <div class="tagline">tu comunidad, tus reglas</div>
  <div class="track" role="progressbar" aria-label="Cargando"><div class="bar"></div></div>
</body>
</html>
