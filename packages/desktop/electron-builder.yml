appId: com.vertex.desktop
productName: VERTEX
artifactName: "${productName}-${version}-${arch}.${ext}"
directories:
  output: dist-electron
files:
  - dist/**/*
  - resources/**/*
  # Exclude host-compiled native module artifacts from the asar.
  # electron-rebuild (postinstall) compiles uiohook-napi for the build machine,
  # creating build/Release/*.node. node-gyp-build checks build/ BEFORE prebuilds/,
  # so if these directories enter the asar, the app crashes on every platform
  # (including the build platform after afterPack removes the unpacked file).
  - "!**/node_modules/uiohook-napi/build/**"
  - "!**/node_modules/uiohook-napi/build.bak/**"
  - "!**/node_modules/uiohook-napi/bin/**"
asarUnpack:
  - "**/*.node"
npmRebuild: false
afterPack: ./scripts/afterPack.js
# Local build only — never publish from here.
publish: null
protocols:
  - name: VERTEX
    schemes:
      - vertex
      - backspace
mac:
  category: public.app-category.social-networking
  minimumSystemVersion: "12.0"
  extendInfo:
    NSAudioCaptureUsageDescription: "VERTEX needs access to system audio to share sound during screen sharing."
  target:
    - dmg
    - zip
win:
  icon: ./build/icon.ico
  target:
    - nsis
linux:
  icon: build/icons/
  target:
    - AppImage
    - deb
  category: Network
nsis:
  # Assisted installer: Language → Welcome → License → Destination →
  # Progress → Finish (with "run VERTEX" checkbox).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerLanguages:
    - es_ES
    - en_US
  displayLanguageSelector: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VERTEX
  # Keep user data (SQLite DB, settings) when uninstalling.
  deleteAppDataOnUninstall: false
  # Branded installer/uninstaller: VERTEX icon + dark sidebar art.
  installerIcon: build/installer-icon.ico
  uninstallerIcon: build/installer-icon.ico
  installerHeaderIcon: build/installer-icon.ico
  installerSidebar: build/installer-sidebar.bmp
  uninstallerSidebar: build/installer-sidebar.bmp
  # MIT license (+ AGPL notice for inherited code) as the assistant's
  # license page. Plain text — NSIS license pages are RTF/txt.
  license: build/license-installer.txt
  include: build/installer.nsh
